<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Tutoriales de IA desde $6.99. Aprende con expertos. Video, PDF, Audio y Workflows.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root{--cyan:#00f2ff;--purple:#bc13fe;--pink:#ff00bd;--dark:#050508;--glass:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.07)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--dark);color:#fff;font-family:'Outfit',sans-serif;overflow-x:hidden;min-height:100vh}
        .glass{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px}
        .neon{text-shadow:0 0 10px var(--cyan),0 0 20px var(--cyan)}
        .card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:16px;transition:all 0.4s}
        .card:hover{transform:translateY(-8px);border-color:var(--cyan);box-shadow:0 0 30px rgba(0,242,255,0.15)}
        .btn{padding:0.75rem 1.5rem;border-radius:12px;font-weight:700;font-size:0.85rem;cursor:pointer;transition:all 0.2s;border:none;display:inline-flex;align-items:center;gap:0.5rem}
        .btn-primary{background:linear-gradient(135deg,#00f2ff,#bc13fe);color:#000}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,242,255,0.3)}
        .btn-outline{background:transparent;border:1px solid var(--border);color:#fff}
        .btn-outline:hover{background:var(--glass);border-color:var(--cyan)}
        .price-tag{background:linear-gradient(135deg,#00f2ff,#bc13fe);color:#000;padding:0.3rem 0.8rem;border-radius:8px;font-weight:900;font-size:0.85rem}
        .fixed-price{position:absolute;top:12px;right:12px;background:linear-gradient(135deg,#00f2ff,#bc13fe);color:#000;padding:0.4rem 1rem;border-radius:10px;font-weight:900;font-size:0.9rem;box-shadow:0 4px 15px rgba(0,242,255,0.3)}
        .toast{position:fixed;bottom:2rem;right:2rem;padding:1rem 1.5rem;border-radius:12px;font-weight:700;font-size:0.85rem;transform:translateX(150%);transition:transform 0.3s;z-index:9999}
        .toast.show{transform:translateX(0)}
        .toast.success{background:#10b981;color:#fff}
        .toast.error{background:#ef4444;color:#fff}
        .modal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.95);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;padding:2rem}
        .modal.active{display:flex}
        .copy-btn{background:rgba(0,242,255,0.1);border:1px solid rgba(0,242,255,0.3);color:var(--cyan);padding:0.5rem 1rem;border-radius:8px;cursor:pointer;font-size:0.75rem;font-weight:700;transition:all 0.2s}
        .copy-btn:hover{background:rgba(0,242,255,0.2)}
        .tab-btn{padding:0.5rem 1rem;border-radius:8px;font-size:0.8rem;font-weight:600;cursor:pointer;background:transparent;color:#94a3b8;border:none;transition:all 0.2s}
        .tab-btn.active{background:var(--cyan);color:#000}
        select{background:rgba(0,0,0,0.5);border:1px solid var(--border);color:#fff;padding:0.5rem 1rem;border-radius:8px;font-size:0.85rem;outline:none}
        select:focus{border-color:var(--cyan)}
        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:10px}
    </style>
</head>
<body>

<!-- PRODUCTS GRID -->

<script>
// ═══════════════════════════════════════════════════
// APOLLO OMEGA — Sistema 100% Local
// ═══════════════════════════════════════════════════

const FIXED_PRICE = 6.99;
const LEMA = "La IA no es una herramienta, es una habilidad";
const PAYMENT_LINK = "https://app.takenos.com/pay/ecf19afd-b6c0-4ada-82d3-c7fc87272e54";

const PAYMENTS = {
    crypto: {
        USDT: { address: "0xeBe965EFe1ab53d2da915134d72e5BdBd5E3C053", net: "BEP20" },
        BTC: { address: "bc1qjjgsx3lwa0wz59l89htcpr28j5s7dtmv99fmw0", net: "Bitcoin" },
        ETH: { address: "0x2F4bc6f77719AB99BCd6a9b553729bB96C9B8c22", net: "Ethereum" }
    },
    banks: {
        USA: { bank: "Lead Bank", holder: "Diego Edgardo Cortez Yanez", acc: "211534854868", route: "101019644" },
        Europa: { bank: "OPENPAYD MALTA", holder: "Diego Edgardo Cortez Yáñez", iban: "MT12CFTE28004000000000005456093", bic: "CFTEMTM1XXX" },
        Bolivia: { bank: "Banco Mercantil Santa Cruz", holder: "DIEGO EDGARDO CORTEZ YAÑEZ", acc: "4069474188", ci: "5808841TJ" },
        Mexico: { bank: "CLABE", holder: "Diego Edgardo Cortez Yañez", clabe: "646180546701268303" }
    },
    stripe: { link: "https://buy.stripe.com/cNicN5727fLAfDd9Ws9Ve06" }
};

let products = [];
let sales = JSON.parse(localStorage.getItem('apollo_sales') || '[]');
let displayed = 0;
const PER_PAGE = 24;
let currentProduct = null;

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════

async function init() {
    try {
        const res = await fetch('products.json');
        const data = await res.json();
        products = data.products;
        
        // Asegurar precio fijo
        products.forEach(p => p.price = FIXED_PRICE);
        
        renderProducts();
        populateCategories();
        updateStats();
        startClock();
        
        // Publicar en Telegram automáticamente
        if (products.length > 0) {
            console.log(`✅ ${products.length} tutoriales cargados a $6.99`);
        }
    } catch(e) {
        console.error('Error cargando productos:', e);
        // Generar productos de ejemplo si no carga el JSON
        generateLocalProducts();
    }
}

function generateLocalProducts() {
    const nichos = [
        "IA Marketing", "Copywriting IA", "Automatización n8n", "SEO con IA",
        "Email Marketing IA", "Imágenes IA", "Video IA", "Chatbots IA",
        "E-commerce IA", "Micro-SaaS IA", "Affiliate IA", "Podcast IA",
        "Presentaciones IA", "Plan de Negocio IA", "Trading IA", "Freelancing IA",
        "Productividad IA", "Análisis Datos IA", "Voice AI", "IA Generativa"
    ];
    
    products = [];
    for (let i = 0; i < 200; i++) {
        const nicho = nichos[i % nichos.length];
        products.push({
            id: 'local_' + i,
            title: `🔥 Tutorial ${nicho} 2026 — Domina la IA`,
            description: `Aprende ${nicho} desde cero. Tutorial completo con video HD, guía PDF (30+ páginas), prompts listos, workflows n8n y audio. "${LEMA}"`,
            price: FIXED_PRICE,
            category: nicho,
            level: 'starter',
            formats: ['video', 'pdf', 'audio', 'workflow'],
            language: 'es'
        });
    }
    renderProducts();
    populateCategories();
    updateStats();
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════

function renderProducts() {
    const grid = document.getElementById('productsGrid');
    const toShow = products.slice(0, displayed + PER_PAGE);
    displayed = toShow.length;
    
    grid.innerHTML = toShow.map(p => `
        <div class="card overflow-hidden group cursor-pointer" onclick="openProduct('${p.id}')">
            <div class="relative h-44 overflow-hidden">
                <div class="w-full h-full bg-gradient-to-br from-cyan-900/40 to-purple-900/40 flex items-center justify-center">
                    <i class="fas fa-brain text-5xl text-cyan-500/30 group-hover:text-cyan-400/60 transition-colors"></i>
                </div>
                <div class="fixed-price">$${FIXED_PRICE}</div>
                <div class="absolute bottom-2 left-2 flex gap-1">
                    ${p.f && p.f.includes('video') ? '<span class="bg-black/70 text-[8px] px-2 py-0.5 rounded text-cyan-400 font-bold">VIDEO</span>' : ''}
                    ${p.f && p.f.includes('pdf') ? '<span class="bg-black/70 text-[8px] px-2 py-0.5 rounded text-purple-400 font-bold">PDF</span>' : ''}
                </div>
            </div>
            <div class="p-4">
                <h3 class="font-bold text-sm text-white group-hover:text-cyan-400 transition-colors line-clamp-2 mb-2">${p.title}</h3>
                <p class="text-[11px] text-gray-500 line-clamp-2 mb-3">${p.description}</p>
                <div class="flex justify-between items-center">
                    <span class="text-[10px] text-cyan-400 font-bold">${p.category}</span>
                    <button class="btn btn-primary text-xs py-2 px-4" onclick="event.stopPropagation(); openCheckout('${p.id}')">Comprar</button>
                </div>
            </div>
        </div>
    `).join('');
    
    document.getElementById('loadMoreContainer').classList.toggle('hidden', displayed >= products.length);
    document.getElementById('statProducts').textContent = products.length;
}

function loadMore() { renderProducts(); }

function populateCategories() {
    const cats = [...new Set(products.map(p => p.category))];
    const sel = document.getElementById('categoryFilter');
    sel.innerHTML = '<option value="all">Todas las categorías</option>' + 
        cats.map(c => `<option value="${c}">${c}</option>`).join('');
}

function filterProducts() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const cat = document.getElementById('categoryFilter').value;
    
    const filtered = products.filter(p => {
        const matchQ = p.title.toLowerCase().includes(q) || p.description.toLowerCase().includes(q);
        const matchCat = cat === 'all' || p.category === cat;
        return matchQ && matchCat;
    });
    
    const grid = document.getElementById('productsGrid');
    displayed = Math.min(PER_PAGE, filtered.length);
    
    grid.innerHTML = filtered.slice(0, displayed).map(p => `
        <div class="card overflow-hidden group cursor-pointer" onclick="openProduct('${p.id}')">
            <div class="relative h-44 overflow-hidden">
                <div class="w-full h-full bg-gradient-to-br from-cyan-900/40 to-purple-900/40 flex items-center justify-center">
                    <i class="fas fa-brain text-5xl text-cyan-500/30"></i>
                </div>
                <div class="fixed-price">$${FIXED_PRICE}</div>
            </div>
            <div class="p-4">
                <h3 class="font-bold text-sm line-clamp-2 mb-2">${p.title}</h3>
                <p class="text-[11px] text-gray-500 line-clamp-2 mb-3">${p.description}</p>
                <div class="flex justify-between items-center">
                    <span class="text-[10px] text-cyan-400 font-bold">${p.category}</span>
                    <button class="btn btn-primary text-xs py-2 px-4" onclick="event.stopPropagation(); openCheckout('${p.id}')">Comprar</button>
                </div>
            </div>
        </div>
    `).join('');
}

// ═══════════════════════════════════════════════════
// PRODUCT DETAIL
// ═══════════════════════════════════════════════════

function openProduct(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    currentProduct = p;
    
    document.getElementById('modalContent').innerHTML = `
        <div class="h-64 bg-gradient-to-br from-cyan-900/40 to-purple-900/40 rounded-xl flex items-center justify-center mb-6">
            <i class="fas fa-brain text-8xl text-cyan-500/30"></i>
        </div>
        <h2 class="text-2xl font-black mb-2">${p.title}</h2>
        <p class="text-gray-400 mb-4">${p.description}</p>
        <div class="flex gap-2 mb-4">
            <span class="bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full text-xs font-bold">📹 Video HD</span>
            <span class="bg-purple-500/20 text-purple-400 px-3 py-1 rounded-full text-xs font-bold">📄 PDF 30+ págs</span>
            <span class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-xs font-bold">🎧 Audio</span>
            <span class="bg-yellow-500/20 text-yellow-400 px-3 py-1 rounded-full text-xs font-bold">⚙️ Workflow</span>
        </div>
        <p class="text-sm text-gray-500 mb-6 italic">"${LEMA}"</p>
        <div class="flex items-center gap-4">
            <span class="text-4xl font-black text-cyan-400">$${FIXED_PRICE}</span>
            <button class="btn btn-primary text-lg px-8 py-3" onclick="openCheckout('${p.id}')"><i class="fas fa-shopping-cart mr-2"></i>Comprar Ahora</button>
        </div>
    `;
    document.getElementById('productModal').classList.add('active');
}

// ═══════════════════════════════════════════════════
// CHECKOUT
// ═══════════════════════════════════════════════════

function openCheckout(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    currentProduct = p;
    document.getElementById('checkoutProductName').textContent = p.title;
    document.getElementById('checkoutModal').classList.add('active');
    switchPayTab('crypto');
}

function switchPayTab(tab) {
    const content = document.getElementById('payContent');
    document.querySelectorAll('#checkoutModal .tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    if (tab === 'crypto') {
        content.innerHTML = `
            <div class="space-y-3">
                <div class="p-3 bg-white/5 rounded-xl flex justify-between items-center">
                    <div><p class="text-[8px] font-bold text-cyan-400 uppercase">USDT / USDC (BEP20)</p><code class="text-[10px] break-all">${PAYMENTS.crypto.USDT.address}</code></div>
                    <button class="copy-btn" onclick="copyText('${PAYMENTS.crypto.USDT.address}')"><i class="fas fa-copy"></i> Copiar</button>
                </div>
                <div class="p-3 bg-white/5 rounded-xl flex justify-between items-center">
                    <div><p class="text-[8px] font-bold text-yellow-400 uppercase">Bitcoin (BTC)</p><code class="text-[10px] break-all">${PAYMENTS.crypto.BTC.address}</code></div>
                    <button class="copy-btn" onclick="copyText('${PAYMENTS.crypto.BTC.address}')"><i class="fas fa-copy"></i> Copiar</button>
                </div>
                <div class="p-3 bg-white/5 rounded-xl flex justify-between items-center">
                    <div><p class="text-[8px] font-bold text-blue-400 uppercase">Ethereum (ETH)</p><code class="text-[10px] break-all">${PAYMENTS.crypto.ETH.address}</code></div>
                    <button class="copy-btn" onclick="copyText('${PAYMENTS.crypto.ETH.address}')"><i class="fas fa-copy"></i> Copiar</button>
                </div>
                <p class="text-[9px] text-center text-amber-500 font-bold">Reportar pago a @d3h1ckt4rglobal_bot</p>
            </div>`;
    } else if (tab === 'bank') {
        content.innerHTML = `
            <div class="space-y-3">
                <div class="p-3 bg-white/5 rounded-xl"><p class="text-[8px] font-bold text-cyan-400 uppercase">🇺🇸 USA — Lead Bank</p><p class="text-[10px]">Routing: ${PAYMENTS.banks.USA.route}<br>Cta: ${PAYMENTS.banks.USA.acc}<br>Titular: ${PAYMENTS.banks.USA.holder}</p></div>
                <div class="p-3 bg-white/5 rounded-xl"><p class="text-[8px] font-bold text-purple-400 uppercase">🇪🇺 Europa — Openpayd</p><p class="text-[10px]">IBAN: ${PAYMENTS.banks.Europa.iban}<br>BIC: ${PAYMENTS.banks.Europa.bic}</p></div>
                <div class="p-3 bg-white/5 rounded-xl"><p class="text-[8px] font-bold text-green-400 uppercase">🇧🇴 Bolivia — BMSC</p><p class="text-[10px]">Cta: ${PAYMENTS.banks.Bolivia.acc}<br>CI: ${PAYMENTS.banks.Bolivia.ci}</p></div>
            </div>`;
    } else {
        content.innerHTML = `
            <div class="text-center py-4">
                <i class="fab fa-stripe text-5xl text-indigo-400 mb-4"></i>
                <p class="text-sm text-gray-400 mb-4">Pago seguro con tarjeta</p>
                <a href="${PAYMENTS.stripe.link}" target="_blank" class="btn btn-primary text-lg"><i class="fas fa-lock"></i> Pagar con Tarjeta</a>
                <p class="text-[10px] text-gray-500 mt-3">Visa • Mastercard • Amex</p>
            </div>`;
    }
}

function copyText(text) {
    navigator.clipboard.writeText(text);
    showToast('✅ Copiado al portapapeles', 'success');
}

function processOrder() {
    const email = document.getElementById('buyerEmail').value;
    if (!email) return showToast('❌ Ingresa tu email', 'error');
    
    const order = {
        id: 'ORD-' + Math.random().toString(36).substr(2, 8).toUpperCase(),
        product: currentProduct.title,
        email: email,
        amount: FIXED_PRICE,
        status: 'pending',
        date: new Date().toISOString()
    };
    sales.unshift(order);
    localStorage.setItem('apollo_sales', JSON.stringify(sales));
    
    closeModal('checkoutModal');
    showToast('✅ Orden registrada: ' + order.id, 'success');
    updateStats();
}

// ═══════════════════════════════════════════════════
// STATS & UTILS
// ═══════════════════════════════════════════════════

function updateStats() {
    document.getElementById('statSales').textContent = sales.length;
    document.getElementById('statRevenue').textContent = '$' + (sales.length * FIXED_PRICE).toFixed(2);
}

function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type + ' show';
    setTimeout(() => t.classList.remove('show'), 3000);
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

function startClock() {
    setInterval(() => {
        document.getElementById('liveTime').textContent = new Date().toLocaleTimeString('es-ES');
    }, 1000);
}

function setView(view, el) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
